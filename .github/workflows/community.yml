name: Accesso Community

# Parte quando viene caricato community/richiesta.txt
on:
  push:
    paths:
      - "community/richiesta.txt"

permissions:
  contents: write

concurrency:
  group: community
  cancel-in-progress: false

jobs:
  accesso:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q playwright cryptography && python -m playwright install --with-deps chromium
      - name: Accesso e lettura voli
        env:
          YPJ_KEY: ${{ secrets.YPJ_KEY }}
        run: |
          git config user.name "YPJ Empty Leg"
          git config user.email "actions@users.noreply.github.com"
          python scripts/community.py
      - name: Salva risultato
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Community: risultato accesso"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
