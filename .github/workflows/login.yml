name: Accesso Telegram (una sola volta)

# Parte da solo quando viene caricato il file di richiesta o il codice cifrato.
on:
  push:
    paths:
      - "login/**"

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q telethon cryptography
      - name: Accesso
        env:
          YPJ_KEY: ${{ secrets.YPJ_KEY }}
        run: python scripts/ypj_emptylegs.py login
      - name: Salva risultato
        run: |
          git config user.name "YPJ Empty Leg"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Accesso Telegram: aggiornamento stato"
          git pull --rebase -q origin main
          git push
