name: Aggiorna Empty Leg

# Avviato ogni ora (minuto 15) da cron-job.org. L'orario interno di GitHub è stato tolto
# perché partiva in modo irregolare e si sovrapponeva. Si può avviare anche caricando run/aggiorna.txt.
on:
  workflow_dispatch:
  push:
    paths:
      - "run/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q telethon cryptography
      - name: Leggi il gruppo e aggiorna i voli
        env:
          YPJ_KEY: ${{ secrets.YPJ_KEY }}
        run: python scripts/ypj_emptylegs.py update
      - name: Controllo Community (ore 9, 13, 21 fino al 16/11/2026)
        id: quando
        run: |
          ORA=$(TZ=Europe/Rome date +%H); GIORNO=$(TZ=Europe/Rome date +%Y%m%d)
          if [ "$GIORNO" -le 20261116 ] && { [ "$ORA" = 09 ] || [ "$ORA" = 13 ] || [ "$ORA" = 21 ] || [ -f run/community_ora.txt ]; }; then
            rm -f run/community_ora.txt
            echo "si=1" >> $GITHUB_OUTPUT
          fi
      - if: steps.quando.outputs.si == '1'
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - if: steps.quando.outputs.si == '1'
        env:
          YPJ_KEY: ${{ secrets.YPJ_KEY }}
        run: python scripts/community.py controlla
      - name: Salva risultato
        run: |
          git config user.name "YPJ Empty Leg"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Empty Leg aggiornati"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
