name: Aggiorna Empty Leg

# Ogni 2 ore dalle 06 alle 22 circa (ora italiana), al minuto 17. Gli orari di GitHub sono in UTC.
# Si può anche avviare caricando il file run/aggiorna.txt, oppure dall'esterno (cron-job.org).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4-20/2 * * *"
  push:
    paths:
      - "run/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q telethon cryptography
      - name: Leggi il gruppo e aggiorna i voli
        env:
          YPJ_KEY: ${{ secrets.YPJ_KEY }}
        run: python scripts/ypj_emptylegs.py update
      - name: Salva risultato
        run: |
          git config user.name "YPJ Empty Leg"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Empty Leg aggiornati"
          git pull --rebase -q origin main
          git push
